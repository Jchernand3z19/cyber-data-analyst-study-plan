name: Pull calendar progress to GitHub

on:
  schedule:
    # 23:55 America/Tegucigalpa (UTC-6) = 05:55 UTC on the following day.
    - cron: "55 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-progress
  cancel-in-progress: false

jobs:
  sync-progress:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Google Calendar credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo "::error::Configure GOOGLE_SERVICE_ACCOUNT_JSON and GOOGLE_CALENDAR_ID in Actions secrets."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Google Calendar client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Import today's completed sessions
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python integrations/google-calendar/sync_progress_to_github.py

      - name: Commit and push tracker changes
        run: |
          if git diff --quiet -- tracker.md; then
            echo "No tracker changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker.md
          git commit -m "chore: sync completed study sessions from Google Calendar [skip ci]"
          git push
