name: GitHub metrics dashboard

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate repository commit metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Jchernand3z19
          template: terminal
          repo: security-data-analyst-learning-path
          filename: assets/metrics.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh security learning metrics [Skip GitHub Action]"
          config_output: svg
          config_timezone: America/Tegucigalpa
          config_animations: yes
          base: header, repositories
          plugin_calendar: yes
          plugin_lines: yes
          plugin_lines_history_limit: 1
          config_display: large
